[system]
compatible=foyer-rpi5
bootloader=uboot
# RAUC's uboot.c writes BOOT_ORDER/BOOT_x_LEFT with fw_setenv (via
# libubootenv, /etc/fw_env.config — see foyer-ubootenv). Boot-attempts are
# required by RAUC's config_file.c when bootloader=uboot; single-digit only
# — see the hex/decimal note in files/foyer-boot.cmd.in.
boot-attempts=3
boot-attempts-primary=3
data-directory=/data/rauc

[keyring]
# Relative to this file's directory (/usr/lib/rauc).
path=ca.cert.pem

# --- OS slots -------------------------------------------------------------
# bootname matches the slot ids used by foyer-boot.cmd.in and the rauc.slot=
# kernel argument. Slot devices, types and parent= relationships are
# unchanged from foyer-x86-64/system.conf — the partition layout is
# identical across every machine.

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootB
type=ext4
bootname=B

# --- container image seed slots -------------------------------------------
# parent= pairs each seed slot to its root slot, so installing a bundle writes
# the OS and its container images together, and a rollback reverts both.

[slot.seed.0]
device=/dev/disk/by-partlabel/seedA
type=ext4
parent=rootfs.0

[slot.seed.1]
device=/dev/disk/by-partlabel/seedB
type=ext4
parent=rootfs.1
