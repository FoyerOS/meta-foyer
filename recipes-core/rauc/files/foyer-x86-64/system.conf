[system]
compatible=foyer-x86-64
bootloader=grub
# grub is loaded from /EFI/BOOT on the ESP, so `load_env` in foyer-grub.cfg
# reads $prefix/grubenv — this path. efi.mount puts the ESP at /efi.
grubenv=/efi/EFI/BOOT/grubenv
# RAUC's own slot status lives on the data partition so it survives updates.
data-directory=/data/rauc

[keyring]
# Relative to this file's directory (/usr/lib/rauc).
path=ca.cert.pem

# --- OS slots -------------------------------------------------------------
# bootname matches the slot ids used by foyer-grub.cfg and the rauc.slot=
# kernel argument.

[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootA
type=ext4
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootB
type=ext4
bootname=B

# --- container image seed slots -------------------------------------------
# parent= pairs each seed slot to its root slot, so installing a bundle writes
# the OS and its container images together, and a rollback reverts both.

[slot.seed.0]
device=/dev/disk/by-partlabel/seedA
type=ext4
parent=rootfs.0

[slot.seed.1]
device=/dev/disk/by-partlabel/seedB
type=ext4
parent=rootfs.1
