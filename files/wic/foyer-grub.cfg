# Foyer OS A/B boot selection, driven by RAUC through grubenv.
#
# RAUC's grub bootloader backend writes ORDER / <slot>_OK / <slot>_TRY into
# grubenv with grub-editenv. This script picks the first slot in ORDER that is
# marked OK and has not already burned its try, sets its TRY flag, and boots it.
# If the boot never reaches `rauc status mark-good` (foyer-boot-confirm.service)
# the TRY flag survives, so the next boot skips that slot and falls through to
# the other one — that is the rollback.
#
# The initial grubenv shipped on the ESP (see recipes-foyer/foyer-grubenv) has
# A_OK=1, so a freshly flashed image boots slot A.

set default=0
set timeout=3

load_env

if [ "$ORDER" == "" ] ; then set ORDER="A B" ; fi
if [ "$A_OK" == "" ] ; then set A_OK=0 ; fi
if [ "$B_OK" == "" ] ; then set B_OK=0 ; fi
if [ "$A_TRY" == "" ] ; then set A_TRY=0 ; fi
if [ "$B_TRY" == "" ] ; then set B_TRY=0 ; fi

for SLOT in $ORDER ; do
    if [ "$SLOT" == "A" ] ; then
        if [ "$A_OK" == "1" -a "$A_TRY" == "0" ] ; then
            set A_TRY=1
            save_env A_TRY
            set default="A"
            break
        fi
    fi
    if [ "$SLOT" == "B" ] ; then
        if [ "$B_OK" == "1" -a "$B_TRY" == "0" ] ; then
            set B_TRY=1
            save_env B_TRY
            set default="B"
            break
        fi
    fi
done

# Both slots exhausted (or neither ever marked good): clear the try flags so the
# next boot gets a fresh pair of attempts, and fall back to slot A.
if [ "$default" == "0" ] ; then
    set A_TRY=0
    set B_TRY=0
    save_env A_TRY B_TRY
    set default="A"
fi

# rauc.slot= tells the running system which slot it booted from; RAUC reads it,
# and so does foyer-seed-mount.service to pick the matching seed partition.
# root= must use PARTLABEL (GPT name) — the kernel cannot resolve a filesystem
# LABEL= without an initramfs. `search --label` below does use the filesystem
# label; both are set to the same string by foyer.wks.in.
set FOYER_ARGS="ro rootwait console=ttyS0,115200 console=tty0"

menuentry "Foyer OS (slot A)" --id A {
    search --no-floppy --label --set=root rootA
    linux /boot/bzImage root=PARTLABEL=rootA rauc.slot=A $FOYER_ARGS
}

menuentry "Foyer OS (slot B)" --id B {
    search --no-floppy --label --set=root rootB
    linux /boot/bzImage root=PARTLABEL=rootB rauc.slot=B $FOYER_ARGS
}
