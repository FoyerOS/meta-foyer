global
    log /dev/log local0
    log /dev/log local1 notice
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user  haproxy
    group haproxy

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s

# Concierge binds 0.0.0.0:8080 (see
# ../concierge/concierge/concierge.toml). This is the only backend today;
# concierge will regenerate this file to add more frontends/backends once it
# owns HAProxy routing.
frontend concierge_in
    bind *:80
    default_backend concierge

backend concierge
    server concierge1 127.0.0.1:8080 check
