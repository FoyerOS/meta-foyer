# Directories on the data partition. These cannot be shipped in the rootfs
# because /data is empty until foyer-data is mounted, and the rootfs is
# read-only anyway.
d /data/containers      0700 root root -
d /data/homeassistant   0755 root root -
d /data/foyer           0755 root root -
d /data/foyer/tmp       0755 root root -
d /data/rauc            0700 root root -
d /data/affine           0755 root root -
d /data/affine/storage   0755 root root -
d /data/affine/config    0755 root root -
d /data/postgres         0700 root root -
d /data/redis            0755 root root -
d /data/foyer/secrets    0700 root root -
d /data/home             0755 root root -
# admin's persistent home, exposed at /home/admin by home.mount. Owned by
# uid/gid name, not a numeric id: useradd/groupadd assign both at do_rootfs
# time from foyer-base-users, and tmpfiles resolves names against the same
# /etc/passwd baked into the rootfs, so they always agree.
d /data/home/admin       0750 admin foyer-admin -
d /data/cloud            0700 root root -
