# Foyer-specific overrides, merged over upstream's default /etc/cloud/cloud.cfg
# from /etc/cloud/cloud.cfg.d/*.cfg — cloud-init merges cfg.d fragments over
# cloud.cfg in filename order, later files winning on conflicting keys, so
# nothing here has to reproduce upstream's own defaults.

# foyer-grow-data.service (see foyer-fs-layout) already owns growing the data
# partition (GPT partition 7) at first boot. Letting cloud-init's growpart
# module run too would race it against the same disk with sfdisk.
growpart:
  mode: "off"

# Nothing for cloud-init to resize: every Foyer filesystem is either
# fixed-size (the A/B slots, seed slots, config partition) or already grown
# by foyer-grow-data.
resize_rootfs: false

# SSH keys and other NoCloud/ConfigDrive user-data should land on the
# existing admin account (see foyer-base-users), not a second
# cloud-init-created user.
system_info:
  default_user:
    name: admin
