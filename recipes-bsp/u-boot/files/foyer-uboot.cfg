# Foyer's A/B boot script (files/foyer-boot.cmd.in) reads and writes the
# environment explicitly via fatload/env import/env export/fatwrite instead
# of CONFIG_ENV_IS_IN_FAT, because that option pins CONFIG_ENV_FAT_INTERFACE
# (mmc/usb/nvme) at compile time — the same .wic has to boot from any of the
# three. See recipes-foyer/foyer-ubootenv for the counterpart on the Linux
# side (fw_printenv/fw_setenv against the same file, same format).
CONFIG_CMD_FAT=y
CONFIG_FAT_WRITE=y
CONFIG_CMD_EXT4=y
CONFIG_CMD_IMPORTENV=y
CONFIG_CMD_EXPORTENV=y
CONFIG_CMD_SETEXPR=y

# The size here, mkenvimage's -s in foyer-ubootenv, foyer_envsize in
# foyer-boot.cmd.in and the third field of /etc/fw_env.config must all agree
# — they address the same on-disk bytes in the same env-file format
# (CRC32 header, NUL-separated key=value, padded).
CONFIG_ENV_SIZE=0x4000

# NVMe boot support for the Pi 5.
CONFIG_NVME=y
CONFIG_NVME_PCI=y
CONFIG_CMD_NVME=y
CONFIG_PCI=y
