# EFI boot support, hardware watchdogs, TPM 2.0, and the guest-integration
# drivers real hypervisors need beyond plain virtio (Hyper-V, Xen). Applies
# to every machine — Azure and some Xen-based clouds run arm64 guests too.
CONFIG_EFI=y
CONFIG_EFI_STUB=y
CONFIG_FB_EFI=y
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_TCG_TPM=y
CONFIG_TCG_TIS=y
CONFIG_HYPERV=y
CONFIG_HYPERV_STORAGE=y
CONFIG_HYPERV_UTILS=y
CONFIG_HYPERV_BALLOON=y
CONFIG_XEN_BLKDEV_FRONTEND=y
CONFIG_XEN_NETDEV_FRONTEND=y
