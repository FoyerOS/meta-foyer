# Storage controllers real hardware needs that the qemu*64 kernel caches
# (virtio-centric) don't build by default. Applies to every machine —
# NVMe/SATA/USB/SD-MMC controllers show up on x86 bare metal, cloud VMs and
# the Pi (NVMe HAT, USB boot) alike.
CONFIG_BLK_DEV_NVME=y
CONFIG_ATA=y
CONFIG_SATA_AHCI=y
CONFIG_ATA_PIIX=y
CONFIG_SCSI=y
CONFIG_BLK_DEV_SD=y
CONFIG_USB_STORAGE=y
CONFIG_UAS=y
CONFIG_MMC=y
CONFIG_MMC_SDHCI=y
CONFIG_MMC_SDHCI_PCI=y
CONFIG_MMC_BLOCK=y
