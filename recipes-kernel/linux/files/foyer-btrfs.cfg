# btrfs backs the foyer-data pool (files/wic/foyer-partitions.wks.inc) on
# every machine, so this applies unconditionally like foyer-storage.cfg.
# =y not =m: there is no initramfs and data.mount runs before
# local-fs.target, so a module would be an ordering risk for no benefit.
CONFIG_BTRFS_FS=y
CONFIG_BTRFS_FS_POSIX_ACL=y
CONFIG_LIBCRC32C=y
CONFIG_CRYPTO_CRC32C=y
CONFIG_ZLIB_DEFLATE=y
CONFIG_LZO_COMPRESS=y
CONFIG_LZO_DECOMPRESS=y
CONFIG_ZSTD_COMPRESS=y
CONFIG_ZSTD_DECOMPRESS=y
