# Cloud/virtio NICs, applicable on every machine: ENA (AWS), gve (GCE),
# hv_netvsc (Azure), virtio_net (QEMU and everything else that presents one).
# Bare-metal PCIe NICs (e1000e, igb, ixgbe, r8169, ...) are x86-only for now
# and live in foyer-net-x86.cfg instead, applied only on foyer-x86-64.
CONFIG_ENA_ETHERNET=y
CONFIG_GVE=y
CONFIG_HYPERV_NET=y
CONFIG_VIRTIO_NET=y
