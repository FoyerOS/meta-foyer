DISTRO = "foyer"
DISTRO_NAME = "Foyer"
DISTRO_VERSION = "0.0.0"
DISTRO_CODENAME = "atre"
MAINTAINER = "mail@rflv.fr"
TARGET_VENDOR = "-foyer"

# --- init / core policy ---
INIT_MANAGER = "systemd"
TCLIBC = "glibc"

# --- distro features: explicit ---
DISTRO_FEATURES_OPTED_OUT = "x11 wayland opengl vulkan nfc 3g pulseaudio ptest debuginfod gobject-introspection-data alsa bluetooth"
# "rauc" is not cosmetic: meta-rauc gates a linux-yocto config fragment on it
# that turns on loop, squashfs and dm-verity, without which the verity-format
# bundles foyer-bundle.bb produces cannot be installed at all.
DISTRO_FEATURES:append = " virtualization pam rauc"

# Note: "efi" is deliberately NOT a distro feature. systemd's PACKAGECONFIG
# filters efi straight out of DISTRO_FEATURES and would build systemd-boot,
# which Foyer does not use — the A/B slot selection lives in grub, driven by
# RAUC through grubenv. The machine conf sets efi in MACHINE_FEATURES instead.

# --- persistent /etc on the config partition ---
# Backs /etc with an overlay whose upper layer lives on the foyer-config
# partition, so configuration survives an A/B update that replaces the whole
# root slot. The device and mount point are machine specific and live in
# conf/machine/*.conf, as the class requires.
IMAGE_CLASSES += "overlayfs-etc"

# --- podman container runtime selection ---
# meta-virtualization defaults VIRTUAL-RUNTIME_container_runtime to "virtual-runc",
# which only the runc package provides, conflicting with our explicit crun package
# (crun replaces /usr/bin/runc by default). Pin the whole podman stack explicitly.
VIRTUAL-RUNTIME_container_runtime = "crun"
VIRTUAL-RUNTIME_container_networking = "netavark"
VIRTUAL-RUNTIME_container_dns = "aardvark-dns"

# --- fallback mirrors ---
PREMIRRORS:prepend = "\
    git://.*/.* https://downloads.yoctoproject.org/mirror/sources/ \
    ftp://.*/.* https://downloads.yoctoproject.org/mirror/sources/ \
    http://.*/.* https://downloads.yoctoproject.org/mirror/sources/ \
    https://.*/.* https://downloads.yoctoproject.org/mirror/sources/ \
"

# --- QA ---
WARN_QA:append = " patch-fuzz"
ERROR_QA:append = " version-going-backwards"
