# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# rpi-u-boot-scr.bbappend only has a matching recipe (in meta-raspberrypi)
# when building for the Pi; the x86/arm64 kas configs deliberately don't pin
# that layer at all (see docs/PLATFORMS.md). BBFILES_DYNAMIC only parses it
# when the "raspberrypi" collection is actually present, instead of a hard
# parse error on every non-Pi build.
BBFILES_DYNAMIC += "raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-bsp/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-foyer"
BBFILE_PATTERN_meta-foyer = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-foyer = "6"

LAYERDEPENDS_meta-foyer = "core"
LAYERSERIES_COMPAT_meta-foyer = "blacksail wrynose"

# Absolute path to this layer, for conf files that need to reference files
# shipped here (LAYERDIR itself is only valid while this file is parsed).
FOYER_LAYERDIR = "${LAYERDIR}"
