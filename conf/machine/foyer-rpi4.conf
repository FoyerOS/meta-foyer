#@TYPE: Machine
#@NAME: Foyer Raspberry Pi 4
#@DESCRIPTION: Foyer OS on the Raspberry Pi 4 (8 GB class) — GPT, U-Boot,
#              A/B root slots. Requires a recent-enough EEPROM to read GPT
#              and a board with >4 GB RAM; see docs/PLATFORMS.md.

RPI_USE_U_BOOT = "1"

# raspberrypi4-64.conf (required below) already prepends "raspberrypi4:" to
# MACHINEOVERRIDES itself, before it pulls in rpi-base.inc (which prepends
# "rpi:" on top) — unlike raspberrypi5.conf, so foyer-rpi4.conf does not
# need to repeat it. Final order: rpi:raspberrypi4:foyer-rpi4.

require conf/machine/raspberrypi4-64.conf
require conf/machine/include/foyer-machine-common.inc

MACHINE_FEATURES:remove = "wifi bluetooth"

IMAGE_FSTYPES = "wic wic.zst wic.bmap ext4"
WKS_FILE = "foyer-rpi.wks.in"
# See the comment in foyer-rpi5.conf: cleared per-machine in foyer-image.bb
# instead, since a machine-conf assignment here cannot beat the class's own
# WKS_FILE_DEPENDS_BOOTLOADERS:aarch64.

FOYER_ESP_SIZE = "256M"

FOYER_KERNEL_IMAGE_PKG     = "kernel-image-image"
FOYER_BOOT_TOOLS           = "libubootenv-bin foyer-ubootenv"
FOYER_BOOTENV_DEPLOY_DEP   = "foyer-ubootenv:do_deploy"
FOYER_IMAGE_EFI_BOOT_FILES = ""

FOYER_MIN_MEMTOTAL_KB = "6000000"

# rpi4's firmware UART is ttyS0 (8250, not the PL011 ttyAMA0 the Pi 5 uses),
# and needs nr_uarts pinned or the mini-UART gets probed as a second port.
FOYER_BOOTARGS_EXTRA = "console=ttyS0,115200 8250.nr_uarts=1"

# See the comment in foyer-rpi5.conf: deliberately no ${KERNEL_IMAGETYPE}
# here, so the boot partition's kernel slot is filled by u-boot.bin
# (renamed to ${SDIMG_KERNELIMAGE}, "kernel8.img") rather than an
# un-A/B-versioned copy of the actual kernel.
RPI_EXTRA_IMAGE_BOOT_FILES = "u-boot.bin;${SDIMG_KERNELIMAGE} boot.scr uboot.env"
