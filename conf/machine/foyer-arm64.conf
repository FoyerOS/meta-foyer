#@TYPE: Machine
#@NAME: Foyer ARM64
#@DESCRIPTION: Foyer OS on generic UEFI ARM64 — cloud instances (Graviton,
#              Ampere-based VMs), QEMU virt, and ARM servers that boot
#              through a standard UEFI + GPT + grub-efi chain, the same
#              shape as foyer-x86-64.

require conf/machine/include/qemu.inc
require conf/machine/include/arm/arch-armv8a.inc
require conf/machine/include/foyer-machine-common.inc

# arch-armv8a.inc's own DEFAULTTUNE default (armv8a-crc) is a weak ?= that
# wins on being first, before ours below would run — set it strong so one
# binary runs on any armv8a CPU (Graviton, Ampere, plain QEMU) instead of
# requiring the crc extension.
DEFAULTTUNE = "armv8a"

# Inherit every ":qemuarm64" override for the same reason foyer-x86-64 pulls
# in ":qemux86-64" — base.bbclass matches COMPATIBLE_MACHINE against
# MACHINEOVERRIDES, and linux-yocto's regex lists qemuarm64. "foyer-arm64"
# stays last, so our own overrides still win.
MACHINEOVERRIDES =. "qemuarm64:"

KMACHINE = "qemuarm64"
KERNEL_IMAGETYPE = "Image"
FOYER_KERNEL_IMAGE_PKG = "kernel-image-image"

MACHINE_FEATURES += "pci efi"

SERIAL_CONSOLES ?= "115200;ttyAMA0"

# --- image types ---
IMAGE_FSTYPES = "wic wic.zst ext4"

WKS_FILE = "foyer.wks.in"

# Substituted into files/wic/foyer-grub.cfg.in by foyer-bootcfg. ttyAMA0 is
# the PL011 UART qemu's "virt" machine (and most ARM server firmware)
# exposes; tty0 covers the virtio-gpu/framebuffer console when one is
# present.
FOYER_BOOTARGS_EXTRA = "console=ttyAMA0,115200 console=tty0"

# --- runqemu ---
# Same "boot the whole disk through firmware, not -kernel" approach as
# foyer-x86-64 — see the comment there. There is no oe-core
# qemuboot-arm64.inc equivalent to require, so these are spelled out here.
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_MACHINE = "-machine virt"
QB_CPU = "-cpu cortex-a57"
QB_MEM = "-m 4096"
QB_DEFAULT_FSTYPE = "wic"
QB_FSINFO = "wic:kernel-in-fs"
QB_DEFAULT_KERNEL = "none"
QB_SMP ?= "-smp 4"
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp::3010-:3010,hostfwd=tcp::8123-:8123,hostfwd=tcp::8000-:80,hostfwd=tcp::2222-:22"
