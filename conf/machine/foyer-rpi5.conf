#@TYPE: Machine
#@NAME: Foyer Raspberry Pi 5
#@DESCRIPTION: Foyer OS on the Raspberry Pi 5 (8 GB class) — GPT, U-Boot,
#              A/B root slots. Requires an EEPROM recent enough to read GPT
#              and a board with >4 GB RAM; see docs/PLATFORMS.md.

RPI_USE_U_BOOT = "1"

# Must precede the require below: rpi-base.inc (pulled in by
# raspberrypi5.conf) branches on RPI_USE_U_BOOT at parse time, and
# soc-family.inc there prepends "rpi:" to MACHINEOVERRIDES — this has to run
# first so the final order is rpi:raspberrypi5:foyer-rpi5, matching upstream
# raspberrypi5 overrides plus our own on top.
MACHINEOVERRIDES =. "raspberrypi5:"

require conf/machine/raspberrypi5.conf
require conf/machine/include/foyer-machine-common.inc

# meta-raspberrypi defaults to no networking features at all beyond what
# MACHINE_FEATURES_DEFAULTS sets; the Pi 5's wifi/bluetooth firmware isn't
# something Foyer manages (no wpa_supplicant/bluez in the image), so drop
# both — this also keeps their firmware blobs out of the seed/root slot.
MACHINE_FEATURES:remove = "wifi bluetooth"

IMAGE_FSTYPES = "wic wic.zst wic.bmap ext4"
WKS_FILE = "foyer-rpi.wks.in"

# The aarch64 default (grub-efi systemd-boot) is irrelevant here — nothing
# on this machine boots through grub — and would otherwise be dragged in as
# an EXTRA_IMAGEDEPENDS purely from the TUNE_ARCH override matching.
# A machine-conf assignment here cannot beat image_types_wic.bbclass's own
# WKS_FILE_DEPENDS_BOOTLOADERS:aarch64 (recipe-inherited classes are parsed
# after config files, so the class's :aarch64 wins regardless of file
# precedence or matching the override) — cleared per-machine in
# foyer-image.bb instead, where recipe-body assignments run last.

# Firmware + dtbs + overlays + u-boot + env land here; ~25M used in practice,
# 256M leaves headroom for overlay experimentation without a wks resize.
FOYER_ESP_SIZE = "256M"

# kernel.bbclass names the deployed package kernel-image-${KERNEL_IMAGETYPE,,};
# KERNEL_IMAGETYPE here is "Image" (set by raspberrypi5.conf's
# KERNEL_IMAGETYPE_UBOOT since RPI_USE_U_BOOT=1).
FOYER_KERNEL_IMAGE_PKG     = "kernel-image-image"
FOYER_BOOT_TOOLS           = "libubootenv-bin foyer-ubootenv"
FOYER_BOOTENV_DEPLOY_DEP   = "foyer-ubootenv:do_deploy"
# No EFI System Partition on the Pi — RPI_EXTRA_IMAGE_BOOT_FILES below puts
# u-boot.bin, boot.scr and uboot.env on the FAT boot partition instead.
FOYER_IMAGE_EFI_BOOT_FILES = ""

# A 4 GB Pi 5's ~3.9M kB MemTotal (after CMA/GPU reserves) sits cleanly below
# this; an 8 GB board's ~7.9M kB sits cleanly above it. See foyer-hw-preflight.
FOYER_MIN_MEMTOTAL_KB = "6000000"

# rpi4: "console=ttyS0,115200 8250.nr_uarts=1" instead — see foyer-rpi4.conf.
FOYER_BOOTARGS_EXTRA = "console=ttyAMA10,115200 console=tty1"

# Deliberately without ${KERNEL_IMAGETYPE}: meta-raspberrypi's default would
# copy the kernel onto the boot partition unversioned, where a RAUC-installed
# bundle would never update it. The kernel instead lives inside each A/B root
# slot (see files/foyer-boot.cmd.in's ext4load) exactly like bzImage does on
# x86. u-boot.bin is renamed to ${SDIMG_KERNELIMAGE} ("kernel_2712.img") so
# the Pi 5's own firmware loads U-Boot first, which then finds the real
# kernel itself via boot.scr.
RPI_EXTRA_IMAGE_BOOT_FILES = "u-boot.bin;${SDIMG_KERNELIMAGE} boot.scr uboot.env"
