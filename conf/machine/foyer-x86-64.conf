#@TYPE: Machine
#@NAME: Foyer x86-64
#@DESCRIPTION: Foyer OS on 64-bit x86 — UEFI, GPT, A/B root slots. The same
#              disk image boots under QEMU (with OVMF) and on generic bare-metal
#              x86 hardware.

require conf/machine/include/qemu.inc
require conf/machine/include/x86/x86-base.inc
require conf/machine/include/x86/tune-corei7.inc
require conf/machine/include/x86/qemuboot-x86.inc
require conf/machine/include/foyer-machine-common.inc

# Inherit every ":qemux86-64" override. This is what lets linux-yocto build for
# us without a bbappend: base.bbclass matches COMPATIBLE_MACHINE against
# MACHINEOVERRIDES, and linux-yocto's regex lists qemux86-64. It also picks up
# KBRANCH, SRCREV_machine and KERNEL_FEATURES for free. "foyer-x86-64" stays
# last in MACHINEOVERRIDES, so our own overrides still win.
MACHINEOVERRIDES =. "qemux86-64:"

# MACHINEOVERRIDES gets us KBRANCH and SRCREV_machine, but KMACHINE defaults to
# ${MACHINE} and names the BSP that kernel-yocto looks up in the kernel cache —
# there is no "foyer-x86-64" BSP there, so point it at the qemux86-64 one. That
# BSP is the generic common-pc-64 configuration, which is exactly what we want
# for both QEMU and bare metal.
KMACHINE = "qemux86-64"

MACHINE_FEATURES += "x86 pci efi"

KERNEL_IMAGETYPE = "bzImage"
SERIAL_CONSOLES ?= "115200;ttyS0"

# tune-corei7 (Nehalem, 2009+) rather than the x86-64-v3 that qemux86-64 uses:
# v3 requires AVX2 and would exclude anything pre-Haswell.
DEFAULTTUNE ?= "corei7-64"

# --- image types ---
# wic is the real deliverable. ext4 is the plain rootfs that RAUC bundles
# consume as the rootfs slot image.
IMAGE_FSTYPES = "wic wic.zst ext4"

WKS_FILE = "foyer.wks.in"

# Substituted into files/wic/foyer-grub.cfg.in by foyer-bootcfg; see the
# comment on FOYER_BOOTARGS_EXTRA in foyer-machine-common.inc.
FOYER_BOOTARGS_EXTRA = "console=ttyS0,115200 console=tty0"

# --- runqemu ---
# Boot the whole disk through OVMF instead of passing a kernel directly:
# "kernel-in-fs" keeps wic in runqemu's vmtypes (see scripts/runqemu, the
# QB_FSINFO parser) so no -kernel is used and grub actually runs.
QB_SYSTEM_NAME = "qemu-system-x86_64"
# runqemu defaults to 256M, which is not enough to be representative: the first
# boot has podman load ~600M of container images out of the seed slot, and the
# VM thrashes into unresponsiveness at the default. Bumped again for the
# shared Postgres/Redis services: four more containers, including Postgres,
# now run alongside Home Assistant.
QB_MEM = "-m 16384"
QB_DEFAULT_FSTYPE = "wic"
QB_FSINFO = "wic:kernel-in-fs"
QB_DEFAULT_KERNEL = "none"
QB_SMP ?= "-smp 8"
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp::8000-:80,hostfwd=tcp::8443-:443,hostfwd=tcp::2222-:22"
